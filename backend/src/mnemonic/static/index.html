<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mnemonic</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5;
           max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.4rem; margin: .75rem 0; }
    #log { display: flex; flex-direction: column; gap: .75rem; padding-bottom: 1rem; }
    .msg { padding: .6rem .8rem; border-radius: .6rem; white-space: pre-wrap;
           overflow-wrap: anywhere; max-width: 100%; }
    .user { background: #e8f0fe; align-self: flex-end; }
    .assistant { background: #f1f3f4; }
    .error { background: #fde8e8; }
    .sources { margin: .5rem 0 0; padding-left: 1.2rem; font-size: .85rem; color: #444;
               white-space: normal; }
    .toolnote { font-size: .8rem; color: #555; font-family: monospace; overflow-wrap: anywhere;
                margin-top: -.4rem; }
    button.link { all: unset; cursor: pointer; color: #1a56c4; text-decoration: underline;
                  overflow-wrap: anywhere; }
    button.link:focus-visible { outline: 2px solid #1a56c4; }
    .chunk { margin: .4rem 0; padding: .5rem; background: #fff; border: 1px solid #ddd;
             border-radius: .4rem; font-size: .8rem; white-space: pre-wrap;
             overflow-wrap: anywhere; max-height: 16rem; overflow: auto; }
    button.make { margin-top: .5rem; padding: .3rem .7rem; font-size: .9rem; }
    .cards { display: grid; gap: .5rem; margin-top: .5rem; white-space: normal; }
    .card { all: unset; cursor: pointer; display: block; padding: .6rem .8rem; background: #fff;
            border: 1px solid #ccc; border-radius: .5rem; overflow-wrap: anywhere;
            white-space: pre-wrap; }
    .card:focus-visible { outline: 2px solid #1a56c4; }
    .card.flipped { background: #eaf6ea; }
    .card small { display: block; margin-top: .3rem; color: #666; }
    #docs { margin-bottom: .75rem; font-size: .9rem; }
    #docs summary { cursor: pointer; }
    #docs ul { list-style: none; padding: 0; margin: .5rem 0; }
    #docs li { display: flex; gap: .5rem; align-items: center; justify-content: space-between;
               padding: .25rem 0; overflow-wrap: anywhere; }
    #docs button { padding: .3rem .7rem; font-size: .9rem; }
    #docs .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    #docs-status { margin: .25rem 0; color: #444; }
    form { position: sticky; bottom: 0; display: flex; gap: .5rem; padding: .75rem 0;
           background: #fff; border-top: 1px solid #ddd; }
    input { flex: 1; min-width: 0; padding: .6rem; font-size: 1rem; } /* 16px: no iOS zoom */
    button { padding: .6rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Mnemonic</h1>
    <button id="new-chat" type="button">New chat</button>
  </header>
  <details id="docs">
    <summary>My documents</summary>
    <p>Upload .md, .txt or text PDFs (up to 5 MB, 50 pages, 5 files). Only this browser can
       search them.</p>
    <div class="row">
      <input id="doc-file" type="file" accept=".md,.txt,.pdf">
      <button id="doc-upload" type="button">Upload</button>
    </div>
    <div id="docs-status" role="status"></div>
    <ul id="doc-list"></ul>
  </details>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask a question…" required>
    <button id="send">Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    // localStorage can throw (private mode, blocked site data): fall back to memory.
    const mem = {};
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch { mem[k] = v; } },
      del(k) { try { localStorage.removeItem(k); } catch { delete mem[k]; } },
    };

    let sessionId = store.get("session_id");
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      store.set("session_id", sessionId);
    }

    // Which uploaded documents this browser may search. NOT a login: a random id kept in
    // localStorage, like the session id (real accounts come in lab 21).
    let ownerId = store.get("owner_id");
    if (!ownerId) {
      ownerId = crypto.randomUUID();
      store.set("owner_id", ownerId);
    }

    function addMessage(role, text = "") {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text; // textContent, never innerHTML: model output is untrusted
      log.appendChild(el);
      el.scrollIntoView({ block: "end" });
      return el;
    }

    // Under the answer: a list "file › heading". Click a source to show / hide the chunk text.
    function renderSources(bubble, sources) {
      if (!sources || !sources.length) return;
      const list = document.createElement("ul");
      list.className = "sources";
      for (const s of sources) {
        const li = document.createElement("li");
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "link";
        toggle.textContent = s.heading ? `${s.file_path} › ${s.heading}` : s.file_path;
        let text = null; // the chunk text, created on the first click and then only toggled
        toggle.addEventListener("click", async () => {
          if (text) {
            text.hidden = !text.hidden;
            return;
          }
          text = document.createElement("pre");
          text.className = "chunk";
          text.textContent = "Loading…";
          li.appendChild(text);
          try {
            const response = await api(`/chunks/${s.id}?owner_id=${ownerId}`);
            if (!response.ok) throw new Error(describeHttpError(response));
            text.textContent = (await response.json()).content; // textContent: docs are untrusted too
          } catch (err) {
            text.remove();
            text = null; // the next click tries again
            toggle.textContent += " (could not load)";
          }
        });
        li.appendChild(toggle);
        list.appendChild(li);
      }
      bubble.appendChild(list);
    }

    // "Make flashcards" under an answer that has sources (a refusal has nothing to learn from).
    function renderActions(bubble, messageId, sources) {
      if (!messageId || !sources || !sources.length) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "make";
      button.textContent = "Make flashcards";
      const box = document.createElement("div"); // the cards, or an error text
      button.addEventListener("click", async () => {
        button.disabled = true;
        button.textContent = "Making flashcards…";
        box.replaceChildren();
        try {
          const response = await api("/flashcards", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, message_id: messageId, owner_id: ownerId }),
          });
          if (!response.ok) {
            // 404 / 422 / 502 carry a readable `detail`; 429 and the rest use the generic text.
            let text = describeHttpError(response);
            if ([404, 422, 502].includes(response.status)) {
              try { text = (await response.json()).detail || text; } catch {}
            }
            throw new Error(text);
          }
          renderCards(box, (await response.json()).cards, sources);
          button.textContent = "Make flashcards again";
        } catch (err) {
          box.textContent = err instanceof TypeError ? "No connection to the server." : err.message;
          button.textContent = "Make flashcards";
        } finally {
          button.disabled = false;
        }
      });
      bubble.append(button, box);
    }

    // A card shows the question; a click flips it to the answer and back.
    function renderCards(box, cards, sources) {
      const list = document.createElement("div");
      list.className = "cards";
      for (const c of cards) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "card";
        const src = sources.find((s) => s.id === c.source_chunk_id);
        let flipped = false;
        const draw = () => {
          el.classList.toggle("flipped", flipped);
          el.textContent = (flipped ? "A: " : "Q: ") + (flipped ? c.answer : c.question);
          if (flipped && src) {
            const note = document.createElement("small");
            note.textContent = "Source: " + src.file_path;
            el.appendChild(note);
          }
        };
        el.addEventListener("click", () => { flipped = !flipped; draw(); });
        draw();
        list.appendChild(el);
      }
      box.replaceChildren(list);
    }

    // Access code: asked once, kept in localStorage, sent as X-API-Key.
    function askKey() {
      const key = (prompt("Access code:") || "").trim();
      if (key) store.set("api_key", key);
      return key;
    }

    // fetch + key header. On 401 the stored key is wrong: erase it and ask once more.
    async function api(path, options = {}) {
      for (let attempt = 0; attempt < 2; attempt++) {
        let key = store.get("api_key") || askKey();
        if (!key) throw new Error("An access code is required.");
        const response = await fetch(path, {
          ...options,
          headers: { ...options.headers, "X-API-Key": key },
        });
        if (response.status !== 401) return response;
        store.del("api_key");
      }
      throw new Error("The access code was not accepted.");
    }

    // Human text for a failed HTTP response.
    function describeHttpError(response) {
      if (response.status === 429) {
        const wait = response.headers.get("Retry-After");
        return "Too many requests right now. " +
          (wait ? `Try again in ${wait} s.` : "Please try again in a minute.");
      }
      if (response.status === 401) return "The access code was not accepted.";
      return `The server returned an error (HTTP ${response.status}). Please try again.`;
    }

    // Parse one SSE block ("event: x\ndata: <json>") into {event, data}.
    function parseEvent(block) {
      let event = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data = JSON.parse(line.slice(6));
      }
      return { event, data };
    }

    // ---- My documents. Everything from the server or the file name goes in via textContent.
    const docList = document.getElementById("doc-list");
    const docStatus = document.getElementById("docs-status");
    const docFile = document.getElementById("doc-file");
    const docUpload = document.getElementById("doc-upload");

    // Readable text for a failed documents call: our 4xx errors carry a string `detail`.
    async function docError(response) {
      if ([409, 413, 415, 422].includes(response.status)) {
        try {
          const detail = (await response.json()).detail;
          if (typeof detail === "string") return detail;
        } catch {}
      }
      return describeHttpError(response);
    }

    function renderDocs(docs) {
      docList.replaceChildren();
      for (const d of docs) {
        const li = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = `${d.filename} (${d.chunks} chunks)`;
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "Delete";
        del.addEventListener("click", async () => {
          del.disabled = true;
          try {
            const response = await api(`/documents/${d.id}?owner_id=${ownerId}`, { method: "DELETE" });
            if (!response.ok && response.status !== 404) throw new Error(await docError(response));
            await loadDocs();
          } catch (err) {
            del.disabled = false;
            docStatus.textContent = err instanceof TypeError ? "No connection to the server." : err.message;
          }
        });
        li.append(label, del);
        docList.appendChild(li);
      }
    }

    async function loadDocs() {
      try {
        const response = await api(`/documents?owner_id=${ownerId}`);
        if (!response.ok) throw new Error(await docError(response));
        renderDocs(await response.json());
      } catch (err) {
        docStatus.textContent = "Could not load your documents: " + err.message;
      }
    }

    docUpload.addEventListener("click", async () => {
      const file = docFile.files[0];
      if (!file) {
        docStatus.textContent = "Choose a file first.";
        return;
      }
      docUpload.disabled = true;
      docStatus.textContent = "Uploading and indexing… this can take a while for big files.";
      try {
        const form = new FormData(); // the browser sets the multipart Content-Type itself
        form.append("owner_id", ownerId);
        form.append("file", file);
        const response = await api("/documents", { method: "POST", body: form });
        if (!response.ok) throw new Error(await docError(response));
        docStatus.textContent = "Done: " + file.name + " is indexed.";
        docFile.value = "";
        await loadDocs();
      } catch (err) {
        docStatus.textContent = err instanceof TypeError ? "No connection to the server." : err.message;
      } finally {
        docUpload.disabled = false;
      }
    });

    async function loadHistory() {
      try {
        const response = await api(`/sessions/${sessionId}/messages`);
        if (!response.ok) throw new Error(describeHttpError(response));
        for (const m of await response.json()) {
          const bubble = addMessage(m.role, m.content);
          renderSources(bubble, m.sources);
          if (m.role === "assistant") renderActions(bubble, m.id, m.sources);
        }
      } catch (err) {
        addMessage("assistant error", "Could not load the chat history: " + err.message);
      }
    }

    async function ask(question) {
      addMessage("user", question);
      const bubble = addMessage("assistant");
      let answer = "";
      let sources = [];
      let lastNote = null;
      const fail = (text) => {
        bubble.classList.add("error");
        bubble.textContent = answer ? answer + "\n\n" + text : text;
      };

      let response;
      try {
        response = await api("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: question, owner_id: ownerId }),
        });
      } catch (err) {
        // fetch() rejects with TypeError when the network is down; ours carry a message.
        fail(err instanceof TypeError ? "No connection to the server. Check your network." : err.message);
        return;
      }
      if (!response.ok) return fail(describeHttpError(response));

      try {
        const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const blocks = buffer.split("\n\n");
          buffer = blocks.pop(); // last piece may be incomplete
          for (const block of blocks) {
            const { event, data } = parseEvent(block);
            if (event === "error") return fail(data);
            if (event === "tool") {
              // One small line under the bubble; textContent only (args come from the model).
              const note = document.createElement("div");
              note.className = "toolnote";
              const expr = data.args.expression ?? JSON.stringify(data.args);
              note.textContent = `${data.name}: ${expr} = ${data.result}`;
              (lastNote || bubble).after(note);
              lastNote = note;
            } else if (event === "sources") {
              sources = data;
              renderSources(bubble, data);
            } else if (event === "done") renderActions(bubble, data.message_id, sources);
            else if (event === "message") {
              answer += data;
              bubble.firstChild
                ? (bubble.firstChild.nodeValue = answer)
                : bubble.append(answer);
              bubble.scrollIntoView({ block: "end" });
            }
          }
        }
      } catch {
        fail("The connection was lost while the answer was streaming.");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      input.value = "";
      send.disabled = true;
      try {
        await ask(question);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    document.getElementById("new-chat").addEventListener("click", () => {
      sessionId = crypto.randomUUID();
      store.set("session_id", sessionId);
      log.replaceChildren();
      input.focus();
    });

    loadHistory();
    loadDocs();
  </script>
</body>
</html>
