[project]
name = "mnemonic"
version = "0.1.0"
description = "Mnemonic — AI study assistant backend"
readme = "README.md"
authors = [
    { name = "Vladislav", email = "358440998+vandertal@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.34.0",
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "fastembed>=0.9.1",
    "google-genai>=3.6.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres + pgvector in TEST_DATABASE_URL (skipped otherwise)",
]
