# Render Blueprint. Secrets and per-environment values are NOT stored here:
# `sync: false` means "ask for the value in the Render dashboard". Render asks only when the
# Blueprint is FIRST created; on an existing Blueprint new `sync: false` keys must be added by hand.
services:
  - type: web
    name: mnemonic
    runtime: python
    plan: free
    rootDir: backend
    # Deploy a commit of the linked branch only after its GitHub checks (.github/workflows/ci.yml)
    # pass. A red test = no deploy. Replaces the deprecated `autoDeploy`.
    autoDeployTrigger: checksPass
    # 1) install locked, non-dev dependencies into backend/.venv
    # 2) download the embedding model into the cache dir below, so the running service
    #    never downloads it (the project dir survives from build to run, /tmp does not)
    buildCommand: >-
      uv sync --frozen --no-dev &&
      uv run --no-sync python -c "from mnemonic.ingest.embedder import embed_query; embed_query('warmup')"
    # Migrations first: Alembic is the only schema owner. `preDeployCommand` would be the cleaner
    # place, but it needs a paid plan. If a migration fails, the server does not start and the
    # health check keeps the previous deploy live.
    startCommand: >-
      .venv/bin/alembic upgrade head &&
      .venv/bin/uvicorn mnemonic.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FASTEMBED_CACHE_PATH
        value: /opt/render/project/src/backend/.cache/fastembed
      - key: JWT_SECRET
        sync: false
      - key: REGISTRATION_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_MODEL
        sync: false
