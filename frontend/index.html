<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mnemonic: study with answers you can verify</title>
    <meta
      name="description"
      content="Ask questions about your notes. Every answer cites its sources or honestly says it doesn't know, and turns into flashcards."
    />
    <meta name="theme-color" content="#fcfcfb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mnemonic" />
    <meta property="og:title" content="Mnemonic: study with answers you can verify" />
    <meta
      property="og:description"
      content="Ask your notes. Get answers with citations you can open, and flashcards to remember them."
    />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mnemonic: study with answers you can verify" />
    <meta
      name="twitter:description"
      content="Ask your notes. Get answers with citations you can open, and flashcards to remember them."
    />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />

    <style>
      /* Paint the right background before the CSS bundle arrives: no white flash in dark mode. */
      html { background: #fcfcfb; }
      html.dark { background: #0e0f12; }
    </style>
    <script>
      // Runs before first paint: sets the theme class and the browser-bar colour, so there is no flash.
      (function () {
        try {
          var pref = localStorage.getItem('mnemonic.theme') || 'system'
          var dark =
            pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#0e0f12' : '#fcfcfb')
          var lang = localStorage.getItem('mnemonic.lang')
          if (lang === 'uk' || lang === 'en') document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
